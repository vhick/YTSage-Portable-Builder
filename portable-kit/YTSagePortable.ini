; Optional official PortableApps.com Launcher recipe.
; Custom .NET launcher is bundled by default; this recipe can replace it if
; PortableApps.comLauncherGenerator is installed and used by the packager.
[Launch]
ProgramExecutable=YTSage\YTSage.exe
WorkingDirectory=%PAL:AppDir%\YTSage
CleanTemp=true
SinglePortableAppInstance=true
DirectoryMoveOK=warn

[Environment]
YTSAGE_PORTABLE_MODE=1
YTSAGE_DATA_DIR=%PAL:DataDir%\YTSage
YTSAGE_FFMPEG_DIR=%PAL:AppDir%\YTSage
DENO_DIR=%PAL:DataDir%\DenoCache
XDG_CACHE_HOME=%PAL:DataDir%\Cache
XDG_CONFIG_HOME=%PAL:DataDir%\yt-dlp-config
PATH=%PAL:AppDir%\YTSage;%PAL:DataDir%\YTSage\bin;%PATH%
